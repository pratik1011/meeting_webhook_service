spring:
  datasource:
    url: jdbc:h2:mem:meetings;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  h2:
    console:
      enabled: true
server:
  error:
    include-message: never
webhook:
  batch:
    size-threshold: 10
    max-wait-ms: 100
  redis:
    enabled: false
