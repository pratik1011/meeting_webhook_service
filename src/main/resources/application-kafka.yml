spring:
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:29092}
    consumer:
      auto-offset-reset: earliest
    producer:
      acks: all
      retries: 3
      properties:
        enable.idempotence: true
webhook:
  batch:
    publish-retry-delay-ms: 1000
  kafka:
    enabled: true
    partitions: 3
    raw-topic: meeting-webhooks-raw
    raw-consumer-group: meeting-webhook-inbox
    raw-consumer-concurrency: 3
    batch-topic: meeting-transcript-batches
    batch-consumer-group: meeting-transcript-processor
    batch-consumer-concurrency: 3
    consumer-retry-attempts: 3
    consumer-retry-delay-ms: 1000